<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer</title>
    <style>
        body {
            background-color: #121212; /* خلفية داكنة بحال السكرين */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 4px;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- بدّل image.jpg بأسماء ملف الصورة ديالك -->
    <img src="CLASH-SQUADRANK.png" alt="Free Fire Image">

</body>
</html>
